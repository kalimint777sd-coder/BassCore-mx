name: Build BASSCORE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack BASSCORE
        run: unzip -q BASSCORE_v1.0.0_starter.zip -d .

      - name: Generate Gradle wrapper
        working-directory: BASSCORE
        run: gradle wrapper --gradle-version 9.6

      - name: Build APK
        working-directory: BASSCORE
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BASSCORE-debug
          path: BASSCORE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
